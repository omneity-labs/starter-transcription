<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#256f47"/></marker></defs><rect width="1600" height="860" fill="#f7f5ed"/><text x="60" y="85" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183027">From an audio recording to subtitles</text><text x="60" y="135" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#183027">Python: daktilo + sawalign packages · TypeScript: direct HTTP</text><rect x="60" y="280" width="240" height="230" rx="20" fill="white" stroke="#ccd7cc"/><text x="78" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183027">Audio recording</text><text x="78" y="380" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183027">interview.wav</text><text x="78" y="420" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183027">Python or TypeScript</text><rect x="370" y="280" width="240" height="230" rx="20" fill="white" stroke="#ccd7cc"/><text x="388" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183027">Daktilo</text><text x="388" y="380" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183027">POST /v1/speech/transcribe</text><text x="388" y="420" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183027">Recognized words</text><rect x="680" y="280" width="240" height="230" rx="20" fill="white" stroke="#ccd7cc"/><text x="698" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183027">Review the text</text><text x="698" y="380" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183027">transcript.txt</text><text x="698" y="420" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183027">Correct words if needed</text><rect x="990" y="280" width="240" height="230" rx="20" fill="white" stroke="#ccd7cc"/><text x="1008" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183027">Sawalign</text><text x="1008" y="380" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183027">POST /v1/speech/align</text><text x="1008" y="420" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183027">Audio + reviewed text</text><rect x="1300" y="280" width="240" height="230" rx="20" fill="white" stroke="#ccd7cc"/><text x="1318" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183027">Timed captions</text><text x="1318" y="380" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183027">captions.srt</text><text x="1318" y="420" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183027">Use in your video editor</text><path d="M305 390 H360" stroke="#256f47" stroke-width="3" marker-end="url(#a)"/><path d="M615 390 H670" stroke="#256f47" stroke-width="3" marker-end="url(#a)"/><path d="M925 390 H980" stroke="#256f47" stroke-width="3" marker-end="url(#a)"/><path d="M1235 390 H1290" stroke="#256f47" stroke-width="3" marker-end="url(#a)"/><path d="M180 275 V205 H1110 V275" stroke="#256f47" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="590" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183027">Same source audio</text><text x="60" y="585" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183027">Python / TypeScript run locally or on your server.</text><text x="60" y="630" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183027">SAWALNI_API_KEY stays in the client environment and Authorization header.</text><text x="60" y="700" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183027">Alignment returns a job ID. Poll until done, then download the SRT.</text><text x="60" y="748" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183027">No key needed for examples/preview.py: inspect the included saved demo offline.</text><text x="60" y="805" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183027">Daktilo recognizes the words. Sawalign times the text you supply.</text></svg>